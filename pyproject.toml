[project]
name = "fourth-official"
version = "0.1.0"
description = "Fourth Official monorepo (Python workspace root)"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "apps/api",
  "packages/contracts",
  "services/explain",
  "services/match-data",
  "services/moments",
  "services/replay",
  "services/simulator",
  "services/stats-engine",
  "services/verifier",
]

[dependency-groups]
dev = [
  "httpx2>=2.13",
  "hypothesis>=6.168",
  "mypy>=2.4",
  "pytest>=9.1",
  "pytest-cov>=7.1",
  "pytest-xdist>=3.8",
  "pyyaml>=6.0.3",
  "ruff>=0.17",
  "types-pyyaml>=6.0.12.20260906",
]

# --- Lint and format ---------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = [
  "apps/*/src",
  "apps/*/tests",
  "packages/*/src",
  "packages/*/tests",
  "services/*/src",
  "services/*/tests",
]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "N",             # naming
  "S",             # bandit (security)
  "C4", "SIM", "RET", "PIE", "PT", "PL", "RUF",
  "ANN",           # type annotations everywhere
  "TID",           # tidy imports
]
ignore = ["PLR2004"]  # magic values: tests compare against literal fixtures by design

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR0913"]  # assert is how pytest works; builders take options
# The simulator is a seeded, deterministic simulation: `random` is the right tool here. Never use it
# for tokens or identifiers; those must come from `secrets`.
"services/simulator/src/**" = ["S311"]
"services/simulator/tests/**" = ["S101", "PLR0913", "S311"]
# Football action names such as LONG_PASS trip the hardcoded-password heuristic.
"services/simulator/src/fourth_official_simulator/probabilities.py" = ["S105"]

[tool.ruff.lint.pylint]
# Keyword-only parameters keep signatures of up to seven arguments readable.
max-args = 7
max-positional-args = 4

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --- Types -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = [
  "apps/api/src",
  "packages/contracts/src",
  "packages/contracts/tests",
  "services/explain/src",
  "services/explain/tests",
  "services/match-data/src",
  "services/match-data/tests",
  "services/moments/src",
  "services/moments/tests",
  "services/replay/src",
  "services/replay/tests",
  "services/simulator/src",
  "services/simulator/tests",
  "services/stats-engine/src",
  "services/stats-engine/tests",
  "services/verifier/src",
  "services/verifier/tests",
  "infra/tests",
]
files = [
  "apps/api/src",
  "apps/api/tests",
  "packages/contracts/src",
  "packages/contracts/tests",
  "services/explain/src",
  "services/explain/tests",
  "services/match-data/src",
  "services/match-data/tests",
  "services/moments/src",
  "services/moments/tests",
  "services/replay/src",
  "services/replay/tests",
  "services/simulator/src",
  "services/simulator/tests",
  "services/stats-engine/src",
  "services/stats-engine/tests",
  "services/verifier/src",
  "services/verifier/tests",
  "infra/tests",
]
plugins = ["pydantic.mypy"]

# --- Tests and coverage ------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
testpaths = [
  "apps/api/tests",
  "packages/contracts/tests",
  "services/explain/tests",
  "services/match-data/tests",
  "services/moments/tests",
  "services/replay/tests",
  "services/simulator/tests",
  "services/stats-engine/tests",
  "services/verifier/tests",
]
# Infrastructure tests need the Azure CLI with Bicep; run them with `make check-infra`.
pythonpath = [
  "infra/tests",
  "packages/contracts/tests",
  "services/explain/tests",
  "services/match-data/tests",
  "services/moments/tests",
  "services/replay/tests",
  "services/simulator/tests",
  "services/stats-engine/tests",
  "services/verifier/tests",
]
markers = ["integration: needs emulators or Azure; excluded from the default run"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = [
  "fourth_official_api",
  "fourth_official_contracts",
  "fourth_official_explain",
  "fourth_official_match_data",
  "fourth_official_moments",
  "fourth_official_replay",
  "fourth_official_simulator",
  "fourth_official_stats",
  "fourth_official_verifier",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Install
        run: uv sync --all-packages --locked
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest -n auto --cov --cov-report=term-missing

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm run coverage
      - name: Build
        run: npm run build

  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BICEP_VERSION: v0.48.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Install
        run: |
          uv sync --all-packages --locked
          az bicep install --version "$BICEP_VERSION"
      - name: Lint Bicep (warnings fail the build)
        run: scripts/lint-bicep.sh
      - name: Policy tests
        run: uv run pytest infra/tests --no-cov

  containers:
    name: containers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build images
        run: |
          docker build -f apps/api/Dockerfile --build-arg APP_VERSION="$GITHUB_SHA" -t fo-api:ci .
          docker build -f apps/web/Dockerfile --build-arg APP_VERSION="$GITHUB_SHA" -t fo-web:ci apps/web
          docker build -f services/match-data/Dockerfile --build-arg APP_VERSION="$GITHUB_SHA" -t fo-match-data:ci .
      - name: Smoke test images
        run: |
          scripts/smoke-container.sh fo-api:ci 8000 fourth-official-api "$GITHUB_SHA"
          scripts/smoke-container.sh fo-web:ci 3000 fourth-official-web "$GITHUB_SHA"
          scripts/smoke-container.sh fo-match-data:ci 8100 fourth-official-match-data "$GITHUB_SHA"
      - name: Scan api image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fo-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan web image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fo-web:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan match-data image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fo-match-data:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # Single stable name for the branch ruleset to require, however the jobs above evolve.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [python, web, infra, containers]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "A required job did not succeed: ${{ toJSON(needs) }}"
            exit 1
          fi

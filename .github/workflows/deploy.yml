name: deploy

# Releases application images to the dev environment on every merge to main.
# Infrastructure is provisioned separately by a person running `azd provision` (ADR-004);
# this workflow's identity can push images and release revisions of the two apps, nothing more.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for workload identity federation

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: dev
      url: ${{ vars.SERVICE_WEB_URI }}
    # Values come from the environment (written by infra/hooks/postprovision.sh) and are only ever
    # referenced as shell variables, never interpolated into scripts.
    env:
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_REGISTRY_ENDPOINT: ${{ vars.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
      SERVICE_API_URI: ${{ vars.SERVICE_API_URI }}
      SERVICE_WEB_URI: ${{ vars.SERVICE_WEB_URI }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      APP_VERSION: ${{ github.sha }}
    steps:
      - name: Check environment configuration
        run: |
          missing=""
          for name in AZURE_ENV_NAME AZURE_LOCATION AZURE_RESOURCE_GROUP AZURE_CONTAINER_REGISTRY_ENDPOINT \
                      SERVICE_API_URI SERVICE_WEB_URI AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            [[ -n "${!name}" ]] || missing="$missing $name"
          done
          if [[ -n "$missing" ]]; then
            echo "::error::Missing environment values:$missing. Run 'azd provision' with GITHUB_DEPLOY_REPOSITORY set."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2.4.0
        with:
          version: 1.35.1

      - name: Sign in with workload identity federation
        run: >
          azd auth login
          --client-id "$AZURE_CLIENT_ID"
          --tenant-id "$AZURE_TENANT_ID"
          --federated-credential-provider github

      - name: Recreate the azd environment from provisioned values
        run: |
          azd env new "$AZURE_ENV_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" --location "$AZURE_LOCATION" --no-prompt
          azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"
          azd env set AZURE_CONTAINER_REGISTRY_ENDPOINT "$AZURE_CONTAINER_REGISTRY_ENDPOINT"

      - name: Build, push and release
        run: azd deploy --all --no-prompt

      - name: Smoke test api
        run: scripts/smoke-deployed.sh "$SERVICE_API_URI" fourth-official-api "$APP_VERSION"

      - name: Smoke test web
        run: scripts/smoke-deployed.sh "$SERVICE_WEB_URI" fourth-official-web "$APP_VERSION"

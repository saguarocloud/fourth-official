[project]
name = "fourth-official-simulator"
version = "0.1.0"
description = "Deterministic synthetic match simulator for Fourth Official"
requires-python = ">=3.12,<3.13"
dependencies = ["fourth-official-contracts"]

[tool.uv.sources]
fourth-official-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fourth_official_simulator"]

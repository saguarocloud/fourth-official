[project]
name = "fourth-official-moments"
version = "0.1.0"
description = "Deterministic moment detection for Fourth Official: goals, chances, cards, VAR and tactical shifts"
requires-python = ">=3.12,<3.13"
dependencies = ["fourth-official-contracts", "fourth-official-stats"]

[tool.uv.sources]
fourth-official-contracts = { workspace = true }
fourth-official-stats = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fourth_official_moments"]

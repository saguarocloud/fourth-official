[project]
name = "fourth-official-explain"
version = "0.1.0"
description = "Explain stage for Fourth Official: the Analyst agent, verification loop and fallbacks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agent-framework-core>=1.19,<2",
  "agent-framework-foundry>=1.13,<2",
  "azure-identity>=1.25,<2",
  "fourth-official-contracts",
  "fourth-official-moments",
  "fourth-official-stats",
  "fourth-official-verifier",
]

[tool.uv.sources]
fourth-official-contracts = { workspace = true }
fourth-official-moments = { workspace = true }
fourth-official-stats = { workspace = true }
fourth-official-verifier = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fourth_official_explain"]

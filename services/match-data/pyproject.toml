[project]
name = "fourth-official-match-data"
version = "0.1.0"
description = "Match Data MCP server for Fourth Official: read-only, time-bounded match facts for agents"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fourth-official-contracts",
  "fourth-official-moments",
  "fourth-official-simulator",
  "fourth-official-stats",
  "mcp>=1.30,<2",
]

[tool.uv.sources]
fourth-official-contracts = { workspace = true }
fourth-official-moments = { workspace = true }
fourth-official-simulator = { workspace = true }
fourth-official-stats = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fourth_official_match_data"]

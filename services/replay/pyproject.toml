[project]
name = "fourth-official-replay"
version = "0.1.0"
description = "Match replay for Fourth Official: publishes events, moments, verified insights and corrections as a live feed"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fourth-official-broadcast",
  "fourth-official-contracts",
  "fourth-official-explain",
  "fourth-official-match-data",
  "fourth-official-moments",
  "fourth-official-policy",
  "fourth-official-stats",
  "fourth-official-verifier",
  "opentelemetry-api>=1.30,<2",
]

[tool.uv.sources]
fourth-official-broadcast = { workspace = true }
fourth-official-contracts = { workspace = true }
fourth-official-policy = { workspace = true }
fourth-official-explain = { workspace = true }
fourth-official-match-data = { workspace = true }
fourth-official-moments = { workspace = true }
fourth-official-stats = { workspace = true }
fourth-official-verifier = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fourth_official_replay"]

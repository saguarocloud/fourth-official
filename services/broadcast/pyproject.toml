[project]
name = "fourth-official-broadcast"
version = "0.1.0"
description = "Broadcast graphics for Fourth Official: overlay specs and the director that times them"
requires-python = ">=3.12,<3.13"
dependencies = ["fourth-official-contracts", "fourth-official-verifier"]

[tool.uv.sources]
fourth-official-contracts = { workspace = true }
fourth-official-verifier = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fourth_official_broadcast"]

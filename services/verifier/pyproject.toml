[project]
name = "fourth-official-verifier"
version = "0.1.0"
description = "Deterministic claim verification and fact rendering for Fourth Official"
requires-python = ">=3.12,<3.13"
dependencies = ["fourth-official-contracts", "fourth-official-stats"]

[tool.uv.sources]
fourth-official-contracts = { workspace = true }
fourth-official-stats = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fourth_official_verifier"]

[project]
name = "fourth-official-provenance"
version = "0.1.0"
description = "Provenance for Fourth Official: a signed record of how every partner item came to be"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fourth-official-contracts",
  "azure-identity>=1.25,<2",
  "azure-keyvault-keys>=4.10,<5",
  "azure-storage-blob[aio]>=12.26,<13",
]

[tool.uv.sources]
fourth-official-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fourth_official_provenance"]

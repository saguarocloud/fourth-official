[project]
name = "fourth-official-proving"
version = "0.1.0"
description = "The Proving Ground for Fourth Official: a seeded benchmark, its scorecard, and the Release Gate"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fourth-official-contracts",
  "fourth-official-explain",
  "fourth-official-match-data",
  "fourth-official-policy",
  "fourth-official-replay",
  "fourth-official-simulator",
  "fourth-official-verifier",
  "azure-identity>=1.25,<2",
  "uvicorn>=0.54",
]

[tool.uv.sources]
fourth-official-contracts = { workspace = true }
fourth-official-explain = { workspace = true }
fourth-official-match-data = { workspace = true }
fourth-official-policy = { workspace = true }
fourth-official-replay = { workspace = true }
fourth-official-simulator = { workspace = true }
fourth-official-verifier = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fourth_official_proving"]

[project]
name = "fourth-official-contracts"
version = "0.1.0"
description = "Canonical match event and correction contracts for Fourth Official"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fourth_official_contracts"]

[project]
name = "fourth-official-api"
version = "0.1.0"
description = "Fourth Official API gateway"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.143",
  "uvicorn[standard]>=0.54",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fourth_official_api"]

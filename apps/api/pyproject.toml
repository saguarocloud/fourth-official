[project]
name = "fourth-official-api"
version = "0.1.0"
description = "Fourth Official API gateway"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.143",
  "fourth-official-contracts",
  "fourth-official-explain",
  "fourth-official-match-data",
  "fourth-official-policy",
  "fourth-official-provenance",
  "fourth-official-replay",
  "fourth-official-verifier",
  "azure-identity>=1.25,<2",
  "uvicorn[standard]>=0.54",
  "azure-storage-blob[aio]>=12.26,<13",
]

[tool.uv.sources]
fourth-official-contracts = { workspace = true }
fourth-official-policy = { workspace = true }
fourth-official-provenance = { workspace = true }
fourth-official-explain = { workspace = true }
fourth-official-match-data = { workspace = true }
fourth-official-replay = { workspace = true }
fourth-official-verifier = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fourth_official_api"]
